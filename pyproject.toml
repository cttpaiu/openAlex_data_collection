[project]
name = "openalex-data-collection"
version = "0.1.0"
description = "CLI tool for collecting quantum computing papers from OpenAlex"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "aiohttp>=3.13.3",
    "click==8.1.8",
    "duckdb>=1.4.4",
    "fastexcel>=0.20.2",
    "langchain-core>=1.3.3",
    "langchain-groq>=1.1.2",
    "langchain-ollama>=1.1.0",
    "polars>=1.38.1",
    "pyarrow>=24.0.0",
    "pycountry>=26.2.16",
    "pydantic>=2.0.0",
    "pymupdf>=1.24.0",
    "pyyaml>=6.0.3",
    "rapidfuzz>=3.0.0",
    "questionary>=2.1.1",
    "rich>=14.3.3",
    "scikit-learn>=1.5.0",
    "sentence-transformers>=3.0.0",
    "xlsxwriter>=3.2.9",
]

[project.scripts]
openalex = "openalex.cli:cli"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["openalex"]


[dependency-groups]
dev = [
    "pytest>=9.0.2",
    "pytest-asyncio>=1.3.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
